name: API Tests

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - prod
  schedule:
    # 03:00 UTC = 06:00 EAT (Africa/Nairobi, UTC+3, no DST)
    - cron: '0 3 * * *'

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}
      # Comma-separated for more than one recipient - see cypress-ui.yml.
      MAIL_TO: ${{ secrets.REPORT_EMAIL_TO || vars.REPORT_EMAIL_TO || 'valentine.komulo@thepalladiumgroup.org' }}
      MAIL_CC: ${{ secrets.REPORT_EMAIL_CC || vars.REPORT_EMAIL_CC }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Cypress 15 requires Node ^20.1.0 || ^22.0.0 || >=24.0.0
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Run API Tests
        id: run_api_tests
        run: npm run cy:api:${{ env.TARGET_ENV }}

      - name: Generate API Report
        if: always()
        run: npm run report:api

      - name: API Test Summary
        if: always()
        run: node scripts/ci-test-summary.js cypress/reports/api "API" "${{ steps.run_api_tests.outcome }}"

      # The folder holds merged.json, the interactive HTML and the PDF.
      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: cypress/reports/api/final

      # The PDF on its own, for one-click download from the run summary.
      - name: Upload API Report PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-pdf
          path: cypress/reports/api/final/api-report.pdf
          if-no-files-found: warn

      # Optional - see the note in cypress-ui.yml for the secrets this needs.
      # Skipped entirely when MAIL_SERVER is unset.
      - name: Build email summary
        continue-on-error: true
        if: always() && env.MAIL_SERVER != ''
        id: email
        run: |
          subject=$(node scripts/report-email.js cypress/reports/api API)
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Email the report
        continue-on-error: true
        if: always() && env.MAIL_SERVER != ''
        uses: dawidd6/action-send-mail@6063705cefe50cb915fc53bb5edffb3dc2feb3f7 # v3.12.0
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: LAMISPlus QA <${{ secrets.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          cc: ${{ env.MAIL_CC }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://cypress/reports/api/final/email.html
          attachments: cypress/reports/api/final/api-report.pdf
          ignore_cert: false

      # Teams, as an alternative or an addition to email - see cypress-ui.yml.
      - name: Notify Teams
        continue-on-error: true
        if: always() && env.TEAMS_WEBHOOK != ''
        run: |
          node scripts/report-teams.js cypress/reports/api API
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @cypress/reports/api/final/teams-card.json \
            "$TEAMS_WEBHOOK" -o /dev/null -w 'Teams responded %{http_code}\n'