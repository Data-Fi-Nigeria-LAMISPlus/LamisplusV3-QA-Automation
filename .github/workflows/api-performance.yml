name: API Performance

# PERFORMANCE - how fast is each endpoint when nothing else is happening?
#
# One request per endpoint, in sequence, no concurrency. Thirteen requests in
# total, so it finishes in seconds and is safe to run often. It answers "has
# anything got slower?" and fails when a single endpoint goes over its budget.
#
# For "how many users can it take", see api-load.yml - that is a different
# question and a much heavier run.
#
# Read-only. Nothing here creates or changes data.
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options: [dev, qa, prod]
      max_endpoint_ms:
        description: "Fail if any endpoint takes longer than this (milliseconds)"
        required: false
        default: "1000"
  schedule:
    # Nightly at 02:30 UTC, half an hour before the functional suites, so a
    # slowdown is visible before the long runs start.
    - cron: '30 2 * * *'

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  performance:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Measure endpoint latency
        run: |
          case "${TARGET_ENV}" in
            dev)  export QA_BASE_URL="${DEV_BASE_URL}" ;;
            prod) export QA_BASE_URL="${PROD_BASE_URL}" ;;
          esac
          npm run perf:api -- --max-endpoint-ms "${{ github.event.inputs.max_endpoint_ms || '1000' }}"

      - name: Summarise
        if: always()
        run: |
          report=cypress/reports/perf/api-performance.json
          [ -f "$report" ] || { echo "No performance report produced."; exit 0; }
          node -e '
            const r = require("./cypress/reports/perf/api-performance.json");
            const line = (s) => console.log(s);
            line("## API performance");
            line("");
            line("**What this measures.** One request to each endpoint, one after another, with no other traffic. It answers *how fast is this endpoint at rest*, and flags any that have got slow. It does not test how the system copes with many users at once - that is the API Load workflow.");
            line("");
            line(`Target **${r.target}** · budget ${r.config.maxEndpointMs} ms per endpoint`);
            line("");
            line("| Endpoint | Status | Time |");
            line("| --- | ---: | ---: |");
            r.baseline.forEach((b) => line(`| ${b.endpoint} | ${b.status} | ${b.ms} ms |`));
            line("");
            line(`Slowest: **${r.slowest.endpoint}** at ${r.slowest.ms} ms.`);
            line("");
            if ((r.breaches || []).length) {
              line("**Over budget**");
              r.breaches.forEach((b) => line(`- ${b}`));
            } else {
              line("Every endpoint within budget.");
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-report
          path: cypress/reports/perf/api-performance.json
          if-no-files-found: warn
