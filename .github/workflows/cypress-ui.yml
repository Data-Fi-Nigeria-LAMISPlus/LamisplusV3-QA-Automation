name: UI Tests

# Everything under cypress/e2e/ui/{smoke,clinical,modules} — i.e. all UI specs
# except the OPD consultation one, which has its own workflow
# (opd-consultation.yml).
#   smoke/    login + registration surface
#   clinical/ the longer patient-journey flows (check-in, triage, vitals, posting on)
#   modules/  per-area coverage: every sidebar destination, worklist, hub and form
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - prod
  schedule:
    - cron: '0 3 * * *'

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}
      # Emailing the report is optional. Lifted into env so the step can check
      # whether it is configured - secrets cannot be read in an `if` directly.
      # Recipients: a comma-separated list, so add the rest of the team to
      # REPORT_EMAIL_TO rather than editing this file -
      #   "someone@example.org,someone.else@example.org"
      # REPORT_EMAIL_CC is optional and works the same way. The committed
      # fallback is a convenience; move it to a repository variable if this repo
      # is ever public, so the address is not scraped.
      MAIL_TO: ${{ secrets.REPORT_EMAIL_TO || vars.REPORT_EMAIL_TO || 'valentine.komulo@thepalladiumgroup.org' }}
      MAIL_CC: ${{ secrets.REPORT_EMAIL_CC || vars.REPORT_EMAIL_CC }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Cypress 15 requires Node ^20.1.0 || ^22.0.0 || >=24.0.0
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Run UI Tests
        id: run_ui_tests
        run: npm run cy:ui:${{ env.TARGET_ENV }}

      # Merges the per-spec JSON, renders the HTML report, then prints the PDF.
      # The PDF is built from the merged JSON so it carries the failure reason for
      # every failed test - see scripts/report-to-pdf.js.
      - name: Generate UI Report
        if: always()
        run: npm run report:ui

      - name: UI Test Summary
        if: always()
        run: node scripts/ci-test-summary.js cypress/reports/ui "UI" "${{ steps.run_ui_tests.outcome }}"

      # The whole folder: merged.json, the interactive HTML and the PDF.
      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: cypress/reports/ui/final

      # The PDF on its own as well, so it can be downloaded from the run summary
      # in one click without unpacking the full report.
      - name: Upload UI Report PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-pdf
          path: cypress/reports/ui/final/ui-report.pdf
          if-no-files-found: warn

      # ── Emailing the report ──────────────────────────────────────────────
      #
      # Optional, and skipped entirely unless MAIL_SERVER is set, so an
      # unconfigured repository is unaffected. Needs these repository secrets:
      #
      #   MAIL_SERVER    smtp host, e.g. smtp.office365.com or smtp-relay.brevo.com
      #   MAIL_PORT      587 for STARTTLS, 465 for SSL
      #   MAIL_USERNAME  the mailbox or API user sending it
      #   MAIL_PASSWORD  an app password or API key, never a normal password
      #
      # and optionally REPORT_EMAIL_TO to override the recipient below.
      - name: Build email summary
        continue-on-error: true
        if: always() && env.MAIL_SERVER != ''
        id: email
        run: |
          subject=$(node scripts/report-email.js cypress/reports/ui UI)
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Email the report
        continue-on-error: true
        if: always() && env.MAIL_SERVER != ''
        uses: dawidd6/action-send-mail@6063705cefe50cb915fc53bb5edffb3dc2feb3f7 # v3.12.0
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: LAMISPlus QA <${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          cc: ${{ env.MAIL_CC }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://cypress/reports/ui/final/email.html
          attachments: cypress/reports/ui/final/ui-report.pdf
          ignore_cert: false

      # Teams, as an alternative or an addition to email. Skipped unless
      # TEAMS_WEBHOOK is set.
      #
      # Create the webhook in Teams: the channel's ... menu > Workflows > "Post to
      # a channel when a webhook request is received". The older Office 365
      # "Incoming Webhook" connector has been retired by Microsoft, so a URL
      # created today comes from Workflows and takes an Adaptive Card, which is
      # what scripts/report-teams.js builds.
      - name: Notify Teams
        continue-on-error: true
        if: always() && env.TEAMS_WEBHOOK != ''
        run: |
          node scripts/report-teams.js cypress/reports/ui UI
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @cypress/reports/ui/final/teams-card.json \
            "$TEAMS_WEBHOOK" -o /dev/null -w 'Teams responded %{http_code}\n'