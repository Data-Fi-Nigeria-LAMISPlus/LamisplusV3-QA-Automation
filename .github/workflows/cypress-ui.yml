name: UI Tests

# Everything under cypress/e2e/ui/{smoke,clinical,modules} — i.e. all UI specs
# except the OPD consultation one, which has its own workflow
# (opd-consultation.yml).
#   smoke/    login + registration surface
#   clinical/ the longer patient-journey flows (check-in, triage, vitals, posting on)
#   modules/  per-area coverage: every sidebar destination, worklist, hub and form
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - prod
  schedule:
    - cron: '0 3 * * *'

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Cypress 15 requires Node ^20.1.0 || ^22.0.0 || >=24.0.0
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Run UI Tests
        id: run_ui_tests
        run: npm run cy:ui:${{ env.TARGET_ENV }}

      # Merges the per-spec JSON, renders the HTML report, then prints the PDF.
      # The PDF is built from the merged JSON so it carries the failure reason for
      # every failed test - see scripts/report-to-pdf.js.
      - name: Generate UI Report
        if: always()
        run: npm run report:ui

      - name: UI Test Summary
        if: always()
        run: node scripts/ci-test-summary.js cypress/reports/ui "UI" "${{ steps.run_ui_tests.outcome }}"

      # The whole folder: merged.json, the interactive HTML and the PDF.
      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: cypress/reports/ui/final

      # The PDF on its own as well, so it can be downloaded from the run summary
      # in one click without unpacking the full report.
      - name: Upload UI Report PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-pdf
          path: cypress/reports/ui/final/ui-report.pdf
          if-no-files-found: warn