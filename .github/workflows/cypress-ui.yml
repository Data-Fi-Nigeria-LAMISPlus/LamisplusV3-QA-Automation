name: UI Tests

# Everything under cypress/e2e/ui/smoke — i.e. all UI modules except the OPD
# consultation spec, which has its own workflow (opd-consultation.yml).
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - prod
  schedule:
    - cron: '0 3 * * *'

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.18.2
          cache: npm

      - run: npm ci

      - name: Run UI Tests
        id: run_ui_tests
        run: npm run cy:ui:${{ env.TARGET_ENV }}

      - name: Generate UI Report
        if: always()
        run: npm run report:ui

      - name: UI Test Summary
        if: always()
        run: node scripts/ci-test-summary.js cypress/reports/ui "UI" "${{ steps.run_ui_tests.outcome }}"

      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: cypress/reports/ui/final