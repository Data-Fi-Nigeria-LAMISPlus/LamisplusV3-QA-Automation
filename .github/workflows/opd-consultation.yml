name: OPD Consultation

# Runs on:
#    so the app repo must explicitly notify this one - see project setup notes)
#  - manual workflow_dispatch
on:
  push:
    branches: [master, main]
  repository_dispatch:
    types: [app-master-push]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment: dev, qa, or prod"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  CI: true
  DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

jobs:
  opd-consultation-fill-form:
    runs-on: ubuntu-latest

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'qa' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.18.2
          cache: npm

      - run: npm ci

      - name: Run OPD Consultation Fill Form test
        id: run_opd_tests
        run: npm run cy:ui:opd-consultation:${{ env.TARGET_ENV }}

      - name: Generate UI Report
        if: always()
        run: npm run report:ui

      - name: OPD Test Summary
        if: always()
        run: node scripts/ci-test-summary.js cypress/reports/ui "OPD Consultation" "${{ steps.run_opd_tests.outcome }}"

      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opd-consultation-report
          path: cypress/reports/ui/final
